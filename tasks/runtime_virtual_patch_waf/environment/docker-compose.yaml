services:
  legacy:
    build:
      context: "."
      dockerfile: "Dockerfile.legacy"
    command: ["python3", "/srv/legacy_server.py"]
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [bench]

  main:
    build:
      context: "."
    user: "1000:1000"
    command: ["python3", "/app/lab_server.py"]
    environment:
      LEGACY_LAB_URL: "http://legacy:9090"
    depends_on:
      legacy:
        condition: service_healthy
    ports:
      - "8080"
    networks: [bench]

networks:
  bench:
    internal: true
